<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — call list extractor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAiIHkxPSIwIiB4Mj0iMSIgeTI9IjEiPgo8c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiNhODU1ZjciLz4KPHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjZmY0ZmEzIi8+CjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPgo8cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxNiIgZmlsbD0idXJsKCNnKSIvPgo8cGF0aCBkPSJNMjIgMTljMC0yLjIgMS44LTQgNC00aDIuMmMxIDAgMS45LjcgMi4xIDEuN2wxLjYgNi40Yy4yLjktLjEgMS44LS44IDIuNGwtMi42IDIuMmMyLjEgNC44IDYgOC43IDEwLjggMTAuOGwyLjItMi42Yy42LS43IDEuNS0xIDIuNC0uOGw2LjQgMS42YzEgLjIgMS43IDEuMSAxLjcgMi4xVjQxYzAgMi4yLTEuOCA0LTQgNEMzMS45IDQ1IDE5IDMyLjEgMTkgMTl6IiBmaWxsPSIjZmZmZmZmIi8+Cjwvc3ZnPg==">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --obsidian: #150a1e;
    --panel: #1e1130;
    --panel-raised: #261a40;
    --hairline: #3a2454;
    --hairline-soft: #291640;
    --parchment: #f8f1fb;
    --parchment-dim: #ab93c4;
    --brass: #c661ff;
    --brass-soft: #8b3ec4;
    --sage: #e07aff;
    --help: #ff4fa3;
    --others: #a855f7;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(168,85,247,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 30%, rgba(255,79,163,0.09), transparent 60%),
      linear-gradient(160deg, #170a22 0%, #200c30 35%, #2b0f3f 70%, #3a0f42 100%);
    color:var(--parchment);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:0 24px 120px;
  }

  .wrap{max-width:740px; margin:0 auto;}

  header{
    padding:64px 0 40px;
    animation:rise .7s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .eyebrow{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:16px;
    color:var(--brass);
    margin:0 0 18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(34px, 5vw, 48px);
    line-height:1.12;
    letter-spacing:-0.015em;
    margin:0 0 22px;
    max-width:14ch;
  }
  .rule{
    width:56px;
    height:1px;
    background:var(--brass-soft);
    margin:0 0 22px;
  }
  header p{
    color:var(--parchment-dim);
    font-size:15px;
    line-height:1.7;
    max-width:46ch;
    margin:0;
  }

  section{margin-bottom:56px;}
  .section-title{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:20px;
    letter-spacing:-0.01em;
    margin:0;
  }

  .panel{
    border:1px solid var(--hairline);
    border-radius:10px;
    background:
      linear-gradient(160deg, rgba(168,85,247,0.05), rgba(255,79,163,0.05)),
      var(--panel);
    padding:36px;
  }

  .dropzone{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    padding:26px 28px;
    cursor:pointer;
    border-radius:8px;
    transition:background .2s ease;
  }
  .dropzone::before, .dropzone::after,
  .dropzone .corner-tr, .dropzone .corner-bl{
    content:'';
    position:absolute;
    width:14px;
    height:14px;
    border:1px solid var(--hairline);
    transition:border-color .2s ease;
  }
  .dropzone::before{ top:6px; left:6px; border-right:none; border-bottom:none; }
  .dropzone::after{ bottom:6px; right:6px; border-left:none; border-top:none; }
  .dropzone .corner-tr{ top:6px; right:6px; border-left:none; border-bottom:none; }
  .dropzone .corner-bl{ bottom:6px; left:6px; border-right:none; border-top:none; }
  .dropzone:hover, .dropzone.hover{ background:rgba(201,161,90,0.045); }
  .dropzone:hover::before, .dropzone:hover::after,
  .dropzone:hover .corner-tr, .dropzone:hover .corner-bl,
  .dropzone.hover::before, .dropzone.hover::after,
  .dropzone.hover .corner-tr, .dropzone.hover .corner-bl{
    border-color:var(--brass);
  }
  .dropzone svg{ flex-shrink:0; color:var(--parchment-dim); }
  .dropzone .copy{ font-size:14px; color:var(--parchment-dim); }
  .dropzone .copy .filename{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:var(--brass);
    margin-top:3px;
  }
  input[type=file]{display:none;}

  .paste-toggle{
    display:inline-block;
    margin-top:22px;
    font-size:13px;
    color:var(--parchment-dim);
    cursor:pointer;
    border-bottom:1px solid var(--hairline);
    padding-bottom:1px;
    transition:color .15s ease, border-color .15s ease;
  }
  .paste-toggle:hover{ color:var(--brass); border-color:var(--brass-soft); }

  textarea{
    display:none;
    width:100%;
    min-height:130px;
    margin-top:16px;
    background:var(--panel-raised);
    border:1px solid var(--hairline);
    border-radius:8px;
    color:var(--parchment);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    line-height:1.7;
    padding:16px;
    resize:vertical;
  }
  textarea.show{display:block;}
  textarea::placeholder{color:#4a4b50;}
  textarea:focus{outline:none; border-color:var(--brass-soft);}

  .actions{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-top:24px;
  }

  button{
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:9px;
    letter-spacing:0.01em;
  }
  .btn-primary{
    background:linear-gradient(135deg, #a855f7, #ff4fa3);
    color:#1a0a20;
    border:1px solid transparent;
    border-radius:7px;
    padding:13px 24px;
    font-weight:600;
    transition:filter .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-primary:disabled{
    background:transparent;
    color:var(--parchment-dim);
    border-color:var(--hairline);
    cursor:not-allowed;
  }

  .btn-ghost{
    background:transparent;
    color:var(--parchment-dim);
    border:1px solid var(--hairline);
    border-radius:7px;
    padding:10px 18px;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn-ghost:hover{ color:var(--brass); border-color:var(--brass-soft); }

  .results-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--parchment-dim);
  }
  .count b{ color:var(--brass); font-weight:600; }
  .results-note{
    font-size:12.5px;
    color:var(--parchment-dim);
    margin:0 0 20px;
  }

  .ledger{
    border-top:1px solid var(--hairline);
  }
  .row{
    display:grid;
    grid-template-columns:1fr 170px 160px;
    align-items:center;
    gap:16px;
    padding:20px 4px;
    border-bottom:1px solid var(--hairline-soft);
  }
  .row.head{
    padding:0 4px 12px;
    border-bottom:1px solid var(--hairline);
  }
  .row.head span{
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--parchment-dim);
    text-transform:uppercase;
    font-weight:500;
  }
  .row .name{
    font-size:14.5px;
    font-weight:500;
    color:var(--parchment);
  }
  .row .phone{
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    color:var(--sage);
    letter-spacing:0.02em;
  }
  .tag{
    display:inline-block;
    max-width:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.02em;
    padding:5px 12px;
    border-radius:999px;
    border:1px solid var(--brass-soft);
    color:var(--brass);
  }
  .tag.tag-help{
    border-color:var(--help);
    color:var(--help);
    background:rgba(255,107,129,0.08);
  }
  .tag.tag-others{
    border-color:var(--others);
    color:var(--others);
    background:rgba(79,216,196,0.08);
  }

  .empty-state{
    padding:48px 4px;
    text-align:center;
    color:var(--parchment-dim);
    font-size:13.5px;
    line-height:1.7;
  }

  footer{
    text-align:center;
    color:#54555a;
    font-size:12px;
    margin-top:64px;
  }

  @media (max-width: 560px){
    .row{ grid-template-columns:1fr; gap:6px; padding:18px 4px; }
    .row.head{ display:none; }
    .row .phone::before{ content:'Phone  '; color:var(--parchment-dim); }
    .row .tag{ margin-top:2px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Chat Extractor</p>
  </header>

  <section>
    <div class="panel">
      <div class="dropzone" id="drop">
        <span class="corner-tr"></span><span class="corner-bl"></span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14a2 2 0 0 0 2-2v-5"/><path d="M5 14v5a2 2 0 0 0 2 2"/></svg>
        <span class="copy">Select a .txt or .csv file<span class="filename" id="filename">nothing chosen yet</span></span>
        <input type="file" id="fileInput" accept=".txt,.csv,text/plain,text/csv">
      </div>
      <span class="paste-toggle" id="pasteToggle">or paste text instead</span>
      <textarea id="pasteArea" placeholder="17:47:14 From Karthikeyan S to Hosts and panelists:&#10;    help 9940497336"></textarea>

      <div class="actions">
        <button class="btn-primary" id="parseBtn" disabled>
          Extract
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section id="resultsSection" style="display:none;">
    <div class="results-head">
      <h2 class="section-title">The list</h2>
      <div style="display:flex; align-items:center; gap:18px;">
        <span class="count" id="countBadge"><b>0</b> found</span>
        <div style="display:flex; gap:10px;">
          <button class="btn-ghost" id="copyBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
          <button class="btn-ghost" id="downloadBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Download CSV
          </button>
        </div>
      </div>
    </div>
    <p class="results-note" id="resultsNote"></p>

    <div class="ledger">
      <div class="row head">
        <span>Name</span><span>Phone</span><span>Status</span>
      </div>
      <div id="resultsBody"></div>
    </div>
  </section>

  <footer>runs entirely in your browser — nothing is uploaded anywhere</footer>
</div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const filenameEl = document.getElementById('filename');
  const parseBtn = document.getElementById('parseBtn');
  const pasteToggle = document.getElementById('pasteToggle');
  const pasteArea = document.getElementById('pasteArea');
  const resultsSection = document.getElementById('resultsSection');
  const resultsBody = document.getElementById('resultsBody');
  const countBadge = document.getElementById('countBadge');
  const resultsNote = document.getElementById('resultsNote');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  let rawText = '';
  let currentFileName = 'leads';
  let lastRows = [];

  const IGNORED_NAMES = ['dr prabhakar raj team', 'dr prabhakar raj'];

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('hover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    currentFileName = file.name.replace(/\.[^.]+$/, '') || 'leads';
    filenameEl.textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => {
      rawText = e.target.result;
      pasteArea.value = rawText;
      parseBtn.disabled = false;
    };
    reader.readAsText(file);
  }

  pasteToggle.addEventListener('click', () => {
    pasteArea.classList.toggle('show');
    if (pasteArea.classList.contains('show')) pasteArea.focus();
  });

  pasteArea.addEventListener('input', () => {
    rawText = pasteArea.value;
    parseBtn.disabled = rawText.trim().length === 0;
  });

  function stripChatPrefix(line) {
    return line
      .replace(/^\[\d{1,2}[:.]\d{2}(?:[:.]\d{2})?(?:\s?[APap][Mm])?,?\s*\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4}\]\s*/, '')
      .replace(/^\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4},?\s*\d{1,2}[:.]\d{2}(?:[:.]\d{2})?(?:\s?[APap][Mm])?\s*-\s*/, '');
  }

  // Matches a plausible phone number: digits with optional spaces/dashes/+prefix,
  // at least 7 digits total. Word-boundary guarded so it won't grab a fragment
  // sitting inside a longer digit/colon run like a timestamp.
  const PHONE_RE = /(?<![\d:])(\+?\d[\d\s\-]{6,15}\d)(?![\d:])/;
  const ZOOM_HEADER_RE = /^(?:\d{4}-\d{2}-\d{2}\s+)?\d{1,2}:\d{2}:\d{2}\s+From\s+(.+?)\s+to\s+(.+?):\s*$/;

  function normalizeStatus(rawStatus) {
    return /help/i.test(rawStatus || '') ? 'Help' : 'Others';
  }

  function looksLikeZoomChat(text) {
    return text.split(/\r?\n/).some(l => ZOOM_HEADER_RE.test(l.trim()));
  }

  function isIgnoredName(name) {
    return IGNORED_NAMES.includes(name.trim().toLowerCase());
  }

  function parseZoomChat(text) {
    const lines = text.split(/\r?\n/);
    const rows = [];
    let current = null;

    function flush() {
      if (!current) return;
      if (isIgnoredName(current.name)) { current = null; return; }
      const bodyText = current.body.join(' ').replace(/\s+/g, ' ').trim();
      const m = bodyText.match(PHONE_RE);
      if (m) {
        const digitsOnly = m[1].replace(/\D/g, '');
        if (digitsOnly.length >= 7) {
          let status = (bodyText.slice(0, m.index) + ' ' + bodyText.slice(m.index + m[1].length))
            .replace(/\s+/g, ' ').trim();
          status = normalizeStatus(status);
          rows.push({ ok: true, name: current.name, phone: digitsOnly, status });
        }
      }
      current = null;
    }

    for (const rawLine of lines) {
      const line = rawLine.replace(/\t/g, ' ').trim();
      if (!line) continue;
      const m = line.match(ZOOM_HEADER_RE);
      if (m) {
        flush();
        current = { name: m[1].trim(), body: [] };
      } else if (current) {
        current.body.push(line);
      }
    }
    flush();
    return rows;
  }

  function parseGeneric(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    const rows = [];
    for (const rawLine of lines) {
      const line = stripChatPrefix(rawLine).replace(/^[-*]\s*/, '');
      const m = line.match(PHONE_RE);
      if (m) {
        const phoneRaw = m[1];
        const digitsOnly = phoneRaw.replace(/\D/g, '');
        let name = line.slice(0, m.index).trim().replace(/[,:\-–]\s*$/, '').trim();
        let status = line.slice(m.index + phoneRaw.length).trim().replace(/^[,:\-–]\s*/, '').trim();
        if (!name) name = '—';
        status = normalizeStatus(status);
        if (isIgnoredName(name)) continue;
        rows.push({ ok: true, name, phone: digitsOnly, status, original: rawLine });
      } else {
        rows.push({ ok: false, name: '', phone: '', status: '', original: rawLine });
      }
    }
    return rows;
  }

  function parseText(text) {
    return looksLikeZoomChat(text) ? parseZoomChat(text) : parseGeneric(text);
  }

  parseBtn.addEventListener('click', () => {
    const text = pasteArea.value || rawText;
    const rows = parseText(text);
    lastRows = groupByStatus(dedupeLeads(rows.filter(r => r.ok)));
    renderResults(rows);
  });

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function groupByStatus(rows) {
    const help = rows.filter(r => r.status === 'Help');
    const others = rows.filter(r => r.status !== 'Help');
    return [...help, ...others];
  }

  // Collapses duplicate phone numbers to a single row.
  // If the same number appears as both Help and Others, the Help version wins.
  function dedupeLeads(rows) {
    const byPhone = new Map();
    for (const r of rows) {
      const existing = byPhone.get(r.phone);
      if (!existing) {
        byPhone.set(r.phone, r);
      } else if (existing.status !== 'Help' && r.status === 'Help') {
        byPhone.set(r.phone, r);
      }
      // otherwise: existing already Help, or both Others — keep the first one seen
    }
    return Array.from(byPhone.values());
  }

  function renderResults(rows) {
    resultsSection.style.display = 'block';
    resultsBody.innerHTML = '';
    const okRows = rows.filter(r => r.ok);
    const bad = rows.filter(r => !r.ok);
    const good = groupByStatus(dedupeLeads(okRows));
    const duplicatesRemoved = okRows.length - good.length;

    countBadge.innerHTML = `<b>${good.length}</b> found`;
    const notes = [];
    if (bad.length) notes.push(`${bad.length} line${bad.length === 1 ? '' : 's'} had no phone number and were left out.`);
    if (duplicatesRemoved > 0) notes.push(`${duplicatesRemoved} duplicate number${duplicatesRemoved === 1 ? '' : 's'} merged (Help kept over Others).`);
    resultsNote.textContent = notes.join(' ');

    if (good.length === 0) {
      const div = document.createElement('div');
      div.className = 'empty-state';
      div.textContent = 'No phone numbers turned up in this text.';
      resultsBody.appendChild(div);
      return;
    }

    for (const r of good) {
      const row = document.createElement('div');
      row.className = 'row';
      const tagClass = r.status === 'Help' ? 'tag-help' : 'tag-others';
      row.innerHTML = `
        <span class="name">${escapeHtml(r.name)}</span>
        <span class="phone">${escapeHtml(r.phone)}</span>
        <span class="tag ${tagClass}" title="${escapeHtml(r.status)}">${escapeHtml(r.status)}</span>`;
      resultsBody.appendChild(row);
    }
  }

  function toCsv(rows) {
    const body = rows.filter(r => r.ok).map(r =>
      [r.name, r.phone, r.status].map(v => `"${v.replace(/"/g,'""')}"`).join(',')
    );
    return body.join('\n');
  }

  function toTsv(rows) {
    const clean = v => v.replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
    const body = rows.filter(r => r.ok).map(r =>
      [clean(r.name), clean(r.phone), clean(r.status)].join('\t')
    );
    return body.join('\n');
  }

  copyBtn.addEventListener('click', () => {
    if (!lastRows.length) return;
    navigator.clipboard.writeText(toTsv(lastRows)).then(() => {
      const orig = copyBtn.innerHTML;
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.innerHTML = orig; }, 1200);
    });
  });

  downloadBtn.addEventListener('click', () => {
    if (!lastRows.length) return;
    const blob = new Blob([toCsv(lastRows)], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentFileName}-extracted.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
